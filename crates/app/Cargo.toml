[package]
name = "orre-app"
description = "Orre: the GPUI dashboard and the `orre` binary (GUI, MCP server and CLI commands)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "orre"

[[bin]]
name = "orre"
path = "src/main.rs"

[[example]]
name = "snapshot"
required-features = ["dev-samples"]

[features]
# The dev driver (ROADMAP U.5): `describe()` and a local socket that drives
# the window, for an agent checking a UI change in the running app. Off by
# default, enabled by no other feature, and a compile error in a release
# build (`src/dev_driver.rs`; decision record "the dev driver" in
# docs/architecture/app.md). gpui-kit's `test-support` gives it the calls
# the UI tests drive the window with.
dev-driver = ["gpui-kit/test-support"]
# Sample data (the `fixture` modules), the component showcase and its
# `--showcase` flag, and the four unbuilt tabs (Trends, Budgets, Net worth,
# Reviews): for the snapshot example and a dev build to look at. Off by
# default and enabled by no release path, so a release build can't show
# invented money as if it were real (W1-3). Tests have them through
# `cfg(test)` without it. The dev driver neither needs nor enables it.
dev-samples = []

[dependencies]
orre-core.workspace = true
orre-import.workspace = true
orre-mcp.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
# `orre export --from/--to` dates.
chrono.workspace = true
clap.workspace = true
# Suggestion payloads in the Inbox's sample data (`inbox::fixture`), which
# the snapshot example and the tests share.
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# `#[gpui_kit::test]` and the headless test platform, for the theme startup
# test. Same version as the normal dependency, as gpui-kit requires.
#
# Trade-off: `test-support` enables `gpui-fast?/test-support`, and Cargo puts
# weak-feature optional deps in Cargo.lock even when they're never built. So
# the gpui-fast family is locked though unused (the `gpui-fast` feature is off;
# `cargo tree -i gpui-fast` finds it in no build), and its exact pins hold two
# crates the app does build one patch back: taffy =0.15.0 (was 0.15.1) and
# unicode-properties =0.1.3 (was 0.1.5). They stay there until gpui-fast
# loosens its pins or gpui-kit drops the weak feature.
gpui-kit = { workspace = true, features = ["test-support"] }
# Writes the offscreen renders of `examples/snapshot.rs` (D5 fidelity check)
# as PNG, with the png feature GPUI already enables.
image.workspace = true
# Reads the bundled fonts' name and OS/2 tables in the font tests.
ttf-parser.workspace = true
# Scratch data dirs for the CLI tests, so they never touch the real one.
tempfile.workspace = true
# Crafts hostile backups (an extra trigger or view, a page overwritten) for
# the Restore dialog's refusal tests (SLI-71). Already core's dependency.
rusqlite.workspace = true
